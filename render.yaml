# Render Blueprint — one-click deploy of the full stack.
# Docs: https://render.com/docs/blueprint-spec
#
# Provisions three resources:
#   1. meal-planner-db   — managed MySQL
#   2. meal-planner-api  — ASP.NET Core API (built from API/Dockerfile)
#   3. meal-planner-web  — React static site (built from Frontend/)
#
# After the first deploy, set the secret values marked `sync: false` in the
# Render dashboard (the LLM provider key, and the web app's API URL once the
# API's public URL is known). See README "Deployment" for the full walkthrough.

databases:
  - name: meal-planner-db
    databaseName: foodfest
    plan: free

services:
  # ── ASP.NET Core API ────────────────────────────────────────────────
  - type: web
    name: meal-planner-api
    runtime: docker
    dockerfilePath: ./API/Dockerfile
    dockerContext: ./API
    plan: free
    healthCheckPath: /api/recipe
    envVars:
      - key: ASPNETCORE_URLS
        value: http://+:5128
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      # Render injects the DB connection string; the API reads
      # ConnectionStrings__DbConnection (see appsettings.json).
      - key: ConnectionStrings__DbConnection
        fromDatabase:
          name: meal-planner-db
          property: connectionString
      # LLM provider (OpenAI-compatible; e.g. OpenRouter). Set in the dashboard.
      - key: OpenAI__ApiKey
        sync: false
      - key: OpenAI__BaseUrl
        sync: false
      - key: OpenAI__Models
        sync: false

  # ── React frontend (static site) ────────────────────────────────────
  - type: web
    name: meal-planner-web
    runtime: static
    buildCommand: cd Frontend && npm ci && npm run build
    staticPublishPath: ./Frontend/build
    envVars:
      # Point the SPA at the deployed API origin. Set this to the API service's
      # public URL (https://meal-planner-api.onrender.com) in the dashboard.
      - key: REACT_APP_API_URL
        sync: false
      - key: CI
        value: "false"
    routes:
      # SPA fallback so client-side routes resolve to index.html
      - type: rewrite
        source: /*
        destination: /index.html
